<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>SIPUS — Pembayaran Denda</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1a2842", background: "#f5f7fa", "on-background": "#0b1c30",
            "surface-container": "#eef2f7", "surface-container-low": "#f8fafc",
            "on-surface": "#0b1c30", "on-surface-variant": "#5a6478",
            outline: "#9ca3af", "outline-variant": "#e5e7eb",
          },
          fontFamily: { manrope: ["Manrope", "sans-serif"], inter: ["Inter", "sans-serif"] },
        }
      },
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="min-h-screen bg-background dark:bg-slate-950 text-on-background dark:text-slate-300 font-inter pb-safe">
  <header
    class="sticky top-0 z-40 bg-background/95 dark:bg-slate-950/95 backdrop-blur px-4 py-3 flex items-center gap-3 border-b border-outline-variant/40 dark:border-slate-800">
    <a id="btn-back" href="koleksi.html"
      class="min-h-10 min-w-10 flex items-center justify-center rounded-full active:scale-95 text-on-surface dark:text-slate-200"
      aria-label="Kembali">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1 class="font-manrope font-bold text-base flex-1 truncate">Pembayaran Denda</h1>
    <button id="btn-toggle-dark" type="button" aria-label="Ganti tema"
      class="min-h-10 min-w-10 rounded-full active:scale-95 text-on-surface dark:text-slate-200">
      <span class="material-symbols-outlined">contrast</span>
    </button>
  </header>

  <main class="px-5 py-6 space-y-5">
    <!-- Total -->
    <section
      class="rounded-2xl bg-gradient-to-br from-rose-500 to-rose-700 text-white p-5 shadow-lg shadow-rose-500/20">
      <p class="text-xs uppercase tracking-wider opacity-80">Total Tagihan</p>
      <p class="font-manrope font-extrabold text-3xl mt-1">Rp 12.000</p>
      <p class="text-xs mt-2 opacity-90 inline-flex items-center gap-1">
        <span class="material-symbols-outlined !text-base">schedule</span>
        Terlambat 12 hari · Filosofi Teras
      </p>
    </section>

    <!-- Detail -->
    <section>
      <h3 class="font-manrope font-bold text-base mb-3">Rincian</h3>
      <dl class="rounded-2xl bg-surface-container-low dark:bg-slate-900 p-4 space-y-3 text-sm">
        <div class="flex justify-between">
          <dt>Buku</dt>
          <dd class="font-medium">Filosofi Teras</dd>
        </div>
        <div class="flex justify-between">
          <dt>Tanggal Pinjam</dt>
          <dd>02 Mar 2026</dd>
        </div>
        <div class="flex justify-between">
          <dt>Jatuh Tempo</dt>
          <dd>15 Apr 2026</dd>
        </div>
        <div class="flex justify-between text-rose-600 dark:text-rose-400 font-semibold">
          <dt>Keterlambatan</dt>
          <dd>12 hari × Rp1.000</dd>
        </div>
        <hr class="border-outline-variant/40 dark:border-slate-800" />
        <div class="flex justify-between text-base">
          <dt class="font-semibold">Total</dt>
          <dd class="font-manrope font-bold">Rp 12.000</dd>
        </div>
      </dl>
    </section>

    <!-- Method -->
    <section>
      <h3 class="font-manrope font-bold text-base mb-3">Metode Pembayaran</h3>
      <div class="space-y-2">
        <label
          class="flex items-center gap-3 p-4 rounded-2xl bg-surface-container-low dark:bg-slate-900 cursor-pointer has-[:checked]:ring-2 has-[:checked]:ring-primary">
          <span
            class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/30 text-primary dark:text-blue-300 flex items-center justify-center"><span
              class="material-symbols-outlined">qr_code_2</span></span>
          <div class="flex-1">
            <p class="font-semibold text-sm">QRIS</p>
            <p class="text-xs text-on-surface-variant dark:text-slate-400">Bayar via aplikasi e-wallet pilihan Anda</p>
          </div>
          <input type="radio" name="method" value="qris" checked class="text-primary focus:ring-primary" />
        </label>
        <label
          class="flex items-center gap-3 p-4 rounded-2xl bg-surface-container-low dark:bg-slate-900 cursor-pointer has-[:checked]:ring-2 has-[:checked]:ring-primary">
          <span
            class="w-10 h-10 rounded-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 flex items-center justify-center"><span
              class="material-symbols-outlined">account_balance</span></span>
          <div class="flex-1">
            <p class="font-semibold text-sm">Transfer Bank</p>
            <p class="text-xs text-on-surface-variant dark:text-slate-400">BCA, Mandiri, BNI, BRI</p>
          </div>
          <input type="radio" name="method" value="bank" class="text-primary focus:ring-primary" />
        </label>
        <label
          class="flex items-center gap-3 p-4 rounded-2xl bg-surface-container-low dark:bg-slate-900 cursor-pointer has-[:checked]:ring-2 has-[:checked]:ring-primary">
          <span
            class="w-10 h-10 rounded-full bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 flex items-center justify-center"><span
              class="material-symbols-outlined">payments</span></span>
          <div class="flex-1">
            <p class="font-semibold text-sm">Tunai di Loket</p>
            <p class="text-xs text-on-surface-variant dark:text-slate-400">Bayar langsung di perpustakaan</p>
          </div>
          <input type="radio" name="method" value="cash" class="text-primary focus:ring-primary" />
        </label>
      </div>
    </section>
  </main>

  <div
    class="fixed bottom-0 left-0 right-0 z-40 px-5 py-3 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-outline-variant/40 dark:border-slate-800">
    <a id="btn-confirm-bayar" href="konfirmasi_denda.html"
      class="w-full min-h-12 rounded-full bg-primary hover:bg-primary-container text-white font-semibold flex items-center justify-center gap-2 active:scale-95 shadow-md shadow-primary/30">
      Bayar Sekarang · Rp 12.000
      <span class="material-symbols-outlined">arrow_forward</span>
    </a>
  </div>

  <script src="app.js"></script>
</body>

</html>
