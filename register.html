<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>SIPUS — Daftar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1a2842", "primary-container": "#0f1a2e", "on-primary": "#ffffff",
            background: "#f5f7fa", "on-background": "#0b1c30",
            surface: "#ffffff", "surface-container": "#eef2f7",
            "on-surface": "#0b1c30", "on-surface-variant": "#5a6478",
            outline: "#9ca3af", "outline-variant": "#e5e7eb",
          },
          fontFamily: { manrope: ["Manrope", "sans-serif"], inter: ["Inter", "sans-serif"] },
        }
      },
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="min-h-screen bg-background dark:bg-slate-950 text-on-background dark:text-slate-300 font-inter">
  <header
    class="sticky top-0 z-40 bg-background/95 dark:bg-slate-950/95 backdrop-blur px-4 py-3 flex items-center gap-3 border-b border-outline-variant/40 dark:border-slate-800">
    <a id="btn-back" href="/"
      class="min-h-10 min-w-10 flex items-center justify-center rounded-full active:scale-95 text-on-surface dark:text-slate-200"
      aria-label="Kembali">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h1 class="font-manrope font-bold text-base flex-1">Registration</h1>
    <span class="font-manrope font-bold text-primary dark:text-blue-300 text-sm">SIPUS</span>
    <button id="btn-toggle-dark" type="button"
      class="min-h-10 min-w-10 rounded-full active:scale-95 text-on-surface dark:text-slate-200"
      aria-label="Ganti tema">
      <span class="material-symbols-outlined">contrast</span>
    </button>
  </header>

  <main class="px-5 py-6 max-w-md mx-auto">
    <div
      class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-outline-variant/50 dark:border-slate-800 p-6">
      <h2 class="font-manrope font-bold text-xl mb-1">Buat Akun Baru</h2>
      <p class="text-sm text-on-surface-variant dark:text-slate-400 mb-6">Lengkapi data diri Anda untuk memulai
        perjalanan literasi.</p>

      <form id="form-register" class="space-y-4">
        <div>
          <label for="reg-name"
            class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant dark:text-slate-400 mb-1.5">Full
            Name</label>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant dark:text-slate-500 !text-xl">person</span>
            <input id="reg-name" type="text" required placeholder="Nama Lengkap"
              class="w-full min-h-12 pl-11 pr-4 rounded-xl border border-outline-variant dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-2 focus:ring-primary/20 text-sm" />
          </div>
        </div>

        <div>
          <label for="reg-email"
            class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant dark:text-slate-400 mb-1.5">Email</label>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant dark:text-slate-500 !text-xl">mail</span>
            <input id="reg-email" type="email" required placeholder="nama@email.com"
              class="w-full min-h-12 pl-11 pr-4 rounded-xl border border-outline-variant dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-2 focus:ring-primary/20 text-sm" />
          </div>
        </div>

        <div>
          <label for="reg-password"
            class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant dark:text-slate-400 mb-1.5">Password</label>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant dark:text-slate-500 !text-xl">lock</span>
            <input id="reg-password" type="password" required placeholder="Min. 8 karakter"
              class="w-full min-h-12 pl-11 pr-4 rounded-xl border border-outline-variant dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-2 focus:ring-primary/20 text-sm" />
          </div>
        </div>

        <div>
          <label for="reg-phone"
            class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant dark:text-slate-400 mb-1.5">Phone
            Number</label>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant dark:text-slate-500 !text-xl">call</span>
            <input id="reg-phone" type="tel" required placeholder="08xx-xxxx-xxxx"
              class="w-full min-h-12 pl-11 pr-4 rounded-xl border border-outline-variant dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-2 focus:ring-primary/20 text-sm" />
          </div>
        </div>

        <div>
          <label for="reg-address"
            class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant dark:text-slate-400 mb-1.5">Address</label>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-3 top-3 text-on-surface-variant dark:text-slate-500 !text-xl">location_on</span>
            <textarea id="reg-address" required rows="2" placeholder="Alamat lengkap sesuai KTP"
              class="w-full min-h-12 pl-11 pr-4 py-3 rounded-xl border border-outline-variant dark:border-slate-700 bg-white dark:bg-slate-800 focus:border-primary focus:ring-2 focus:ring-primary/20 text-sm resize-none"></textarea>
          </div>
        </div>

        <button id="btn-register" type="submit"
          class="w-full min-h-12 rounded-xl bg-primary hover:bg-primary-container text-white font-semibold tracking-wide active:scale-95 shadow-md shadow-primary/30 mt-2">
          Daftar Sekarang
        </button>
      </form>

      <p class="text-center text-sm text-on-surface-variant dark:text-slate-400 mt-5">
        Sudah punya akun?
        <a id="link-login" href="/" class="font-semibold text-primary dark:text-blue-300">Login</a>
      </p>
    </div>

    <p class="text-[11px] text-center text-on-surface-variant dark:text-slate-500 mt-5">
      Dengan mendaftar Anda menyetujui <a href="#" class="underline">Syarat &amp; Ketentuan</a> SIPUS Digital Indonesia.
    </p>
  </main>
  <script src="app.js"></script>
</body>

</html>
