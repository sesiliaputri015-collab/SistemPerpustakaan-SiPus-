<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>SIPUS — Pembayaran Berhasil</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#1a2842", background: "#f5f7fa", "on-background": "#0b1c30",
            "surface-container": "#eef2f7", "surface-container-low": "#f8fafc",
            "on-surface": "#0b1c30", "on-surface-variant": "#5a6478",
            outline: "#9ca3af", "outline-variant": "#e5e7eb",
          },
          fontFamily: { manrope: ["Manrope", "sans-serif"], inter: ["Inter", "sans-serif"] },
        }
      },
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="min-h-screen bg-background dark:bg-slate-950 text-on-background dark:text-slate-300 font-inter pb-safe">
  <main class="min-h-screen flex flex-col items-center px-6 py-12 max-w-md mx-auto">
    <div class="w-24 h-24 rounded-full bg-emerald-100 dark:bg-emerald-900/30 flex items-center justify-center mb-6">
      <span class="material-symbols-outlined !text-6xl text-emerald-600 dark:text-emerald-400">task_alt</span>
    </div>
    <h1 class="font-manrope font-bold text-2xl text-center">Pembayaran Berhasil</h1>
    <p class="text-sm text-center text-on-surface-variant dark:text-slate-400 mt-2">
      Denda Rp12.000 telah diterima. Terima kasih.
    </p>

    <section class="w-full mt-8 rounded-2xl bg-surface-container dark:bg-slate-900 p-5">
      <h3 class="font-manrope font-bold text-base mb-3">Bukti Pembayaran</h3>
      <dl class="space-y-2 text-sm">
        <div class="flex justify-between">
          <dt class="text-on-surface-variant dark:text-slate-400">ID Transaksi</dt>
          <dd class="font-mono font-medium">DND-26042701</dd>
        </div>
        <div class="flex justify-between">
          <dt class="text-on-surface-variant dark:text-slate-400">Tanggal</dt>
          <dd class="font-medium">27 Apr 2026, 10:24</dd>
        </div>
        <div class="flex justify-between">
          <dt class="text-on-surface-variant dark:text-slate-400">Metode</dt>
          <dd class="font-medium">QRIS</dd>
        </div>
        <div class="flex justify-between">
          <dt class="text-on-surface-variant dark:text-slate-400">Buku</dt>
          <dd class="font-medium">Filosofi Teras</dd>
        </div>
        <hr class="my-2 border-outline-variant/40 dark:border-slate-800" />
        <div class="flex justify-between text-base">
          <dt class="font-semibold">Total</dt>
          <dd class="font-manrope font-bold text-emerald-600 dark:text-emerald-400">Rp 12.000</dd>
        </div>
      </dl>
    </section>

    <button id="btn-download-receipt" type="button"
      class="mt-5 inline-flex items-center gap-2 text-sm font-medium text-primary dark:text-blue-300 active:scale-95">
      <span class="material-symbols-outlined !text-base">download</span> Unduh struk
    </button>

    <div class="w-full mt-auto pt-8 space-y-3">
      <a id="btn-back-collection" href="koleksi.html"
        class="w-full min-h-12 rounded-full bg-primary hover:bg-primary-container text-white font-semibold flex items-center justify-center active:scale-95 shadow-md shadow-primary/30">
        Kembali ke Koleksi
      </a>
      <a id="btn-back-home" href="beranda.html"
        class="w-full min-h-12 rounded-full border border-outline-variant dark:border-slate-700 text-on-surface dark:text-slate-200 font-medium flex items-center justify-center active:scale-95">
        Ke Beranda
      </a>
    </div>
  </main>

  <script src="app.js"></script>
</body>

</html>
